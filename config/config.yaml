app:
  timezone: "Asia/Shanghai"
  show_version_update: true

# 钉钉推送 webhook（dispatcher.py 需要扁平 key）
DINGTALK_WEBHOOK_URL: "https://oapi.dingtalk.com/robot/send?access_token=229792885f8ea53308ad961bc60c25ac2923be7bc648b823e17b3a288d605db9"

# 启用通知推送（必须为 true 才能推送）
ENABLE_NOTIFICATION: true

# ✅ 修改点 1: 切换到 custom 模式，启用 08:00-21:00 推送策略
schedule:
  enabled: true
  preset: "custom"

# ✅ 关键修复：platforms 必须包含 enabled 和 sources 键
platforms:
  enabled: true
  sources:
    # === 综合新闻媒体类 ===
    - id: "toutiao"
      name: "今日头条"
    - id: "baidu"
      name: "百度热搜"
    - id: "thepaper"
      name: "澎湃新闻"
    - id: "ifeng"
      name: "凤凰网"
    - id: "cankaoxiaoxi"
      name: "参考消息"
    - id: "zaobao"
      name: "联合早报"
    
    # === 财经投资类 ===
    - id: "wallstreetcn-hot"
      name: "华尔街见闻 最热"
    - id: "wallstreetcn-quick"
      name: "华尔街见闻 快讯"
    - id: "cls-hot"
      name: "财联社热门"
    - id: "cls-telegraph"
      name: "财联社 电报"
    - id: "jin10"
      name: "金十数据"
    - id: "xueqiu"
      name: "雪球"

    # === 社交/短视频/娱乐类 ===
    - id: "weibo"
      name: "微博"
    - id: "douyin"
      name: "抖音"
    - id: "bilibili-hot-search"
      name: "bilibili 热搜"
    - id: "tieba"
      name: "贴吧"
    - id: "zhihu"
      name: "知乎"
    - id: "hupu"
      name: "虎扑"

    # === 科技类平台 ===
    - id: "ithome"
      name: "IT之家"
    - id: "juejin"
      name: "掘金"
    - id: "github"
      name: "GitHub"
    - id: "hackernews"
      name: "Hacker News"
    - id: "v2ex"
      name: "V2EX"
    - id: "sspai"
      name: "少数派"

