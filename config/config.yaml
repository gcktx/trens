report:
  mode: "incremental"
  display_mode: "keyword"
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 0

display:
  region_order:
    - new_items
    - hotlist
    - rss
    - standalone
    - ai_analysis
  regions:
    hotlist: true
    new_items: false
    rss: true
    standalone: false
    ai_analysis: false  # ⚠️ 暂时关闭 AI 分析，确保爬虫先跑通
  standalone:
    platforms: ["zhihu", "wallstreetcn-hot"]
    rss_feeds: []
    max_items: 20

# ✅ 修改点 2 & 3: 开启通知并填入钉钉 Webhook
notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ""
    dingtalk:
      # ✅ 已填入你的钉钉机器人地址
      webhook_url: "https://oapi.dingtalk.com/robot/send?access_token=229792885f8ea53308ad961bc60c25ac2923be7bc648b823e17b3a288d605db9"
    telegram:
      bot_token: ""
      chat_id: ""

storage:
  backend: "auto"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 0

ai:
  model: "deepseek/deepseek-chat"
  api_key: ""
  timeout: 120
  temperature: 1.0
  max_tokens: 5000

ai_analysis:
  enabled: false  # ⚠️ 暂时关闭
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "follow_report"
  max_news_for_analysis: 50
  include_rss: false
  include_standalone: false
  include_rank_timeline: false

ai_translation:
  enabled: false
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"

advanced:
  debug: false
  crawler:
    request_interval: 2000
    use_proxy: false
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  batch_size:
    default: 4000
  batch_send_interval: 3
